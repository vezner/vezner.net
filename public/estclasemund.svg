<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" fill="none">
  <!-- Definiciones para Gradientes y Sombras -->
  <defs>
    <linearGradient id="neonGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#25D366" />
      <stop offset="100%" stop-color="#075E54" />
    </linearGradient>
    <linearGradient id="darkCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E1E24" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#121214" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#25D366" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#25D366" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#25D366" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Grilla de Fondo de Ingeniería / Blueprint -->
  <g opacity="0.15">
    <circle cx="250" cy="250" r="220" stroke="#25D366" stroke-width="1" stroke-dasharray="4 6" />
    <circle cx="250" cy="250" r="160" stroke="#25D366" stroke-width="1" />
    <line x1="30" y1="250" x2="470" y2="250" stroke="#25D366" stroke-width="1" stroke-dasharray="2 4" />
    <line x1="250" y1="30" x2="250" y2="470" stroke="#25D366" stroke-width="1" stroke-dasharray="2 4" />
  </g>

  <!-- LÍNEAS DE CONEXIÓN DE RED (Nodos Modulares) -->
  <g stroke="#25D366" stroke-width="1.5" opacity="0.4">
    <path d="M 120 180 L 250 110 L 380 180 L 380 320 L 250 390 L 120 320 Z" stroke-dasharray="5 5" />
    <line x1="250" y1="110" x2="250" y2="210" />
    <line x1="120" y1="180" x2="210" y2="250" />
    <line x1="380" y1="180" x2="290" y2="250" />
  </g>

  <!-- NODOS FLOTANTES CON TEXTURA TECH -->
  <circle cx="250" cy="110" r="6" fill="#25D366" filter="url(#glow)" />
  <circle cx="120" cy="180" r="4" fill="#25D366" />
  <circle cx="380" cy="180" r="4" fill="#25D366" />
  <circle cx="120" cy="320" r="4" fill="#25D366" />
  <circle cx="380" cy="320" r="4" fill="#25D366" />
  <circle cx="250" cy="390" r="6" fill="#25D366" filter="url(#glow)" />

  <!-- TARJETA CENTRAL: AUDITORÍA DE RENDIMIENTO (Estilo Lighthouse) -->
  <g transform="translate(140, 150)">
    <!-- Fondo de Tarjeta de Cristal Oscuro -->
    <rect width="220" height="200" rx="20" fill="url(#darkCardGrad)" stroke="#25D366" stroke-width="1.5" />
    <rect width="220" height="200" rx="20" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.1" />
    
    <!-- Líneas de adorno tipo código de barras/UI -->
    <line x1="20" y1="25" x2="70" y2="25" stroke="url(#lineGrad)" stroke-width="3" />
    <circle cx="195" cy="25" r="3" fill="#25D366" />
    <circle cx="185" cy="25" r="3" fill="#25D366" opacity="0.5" />

    <!-- Círculo de Carga 100% Score -->
    <g transform="translate(110, 105)">
      <!-- Círculo de fondo apagado -->
      <circle r="50" fill="none" stroke="#25D366" stroke-width="6" opacity="0.1" />
      <!-- Círculo de progreso brillante -->
      <circle r="50" fill="none" stroke="url(#neonGreenGrad)" stroke-width="6" 
              stroke-dasharray="314" stroke-dashoffset="0" 
              transform="rotate(-90)" stroke-linecap="round" filter="url(#glow)" />
      
      <!-- Texto del Score Interno -->
      <text text-anchor="middle" y="8" fill="#ffffff" font-family="monospace" font-size="26" font-weight="bold" letter-spacing="-1">100</text>
    </g>

    <!-- Subtítulo de la Interfaz -->
    <text x="110" y="180" text-anchor="middle" fill="#25D366" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="2" opacity="0.9">SISTEMA OPTIMIZADO</text>
  </g>

  <!-- MINI PANEL FLOTANTE IZQUIERDO: SEGURIDAD (Cifrado) -->
  <g transform="translate(40, 260)" filter="url(#glow)">
    <rect width="110" height="55" rx="12" fill="#121214" fill-opacity="0.9" stroke="#25D366" stroke-width="1" />
    <!-- Icono de Candado Simplificado -->
    <rect x="20" y="24" width="16" height="14" rx="3" fill="none" stroke="#25D366" stroke-width="2" />
    <path d="M 23 24 L 23 19 A 5 5 0 0 1 33 19 L 33 24" fill="none" stroke="#25D366" stroke-width="2" stroke-linecap="round" />
    <!-- Texto Info -->
    <text x="48" y="28" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold">SSL</text>
    <text x="48" y="42" fill="#25D366" font-family="monospace" font-size="9">ACTIVO</text>
  </g>

  <!-- MINI PANEL FLOTANTE DERECHO: RENDIMIENTO (Uptime) -->
  <g transform="translate(340, 110)">
    <rect width="120" height="55" rx="12" fill="#121214" fill-opacity="0.9" stroke="#25D366" stroke-width="1" />
    <!-- Gráfico de Ondas de Pulso Estable -->
    <path d="M 15 32 L 30 32 L 35 15 L 42 43 L 48 25 L 53 32 L 70 32" fill="none" stroke="#25D366" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
    <!-- Texto Info -->
    <text x="78" y="28" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold">99.9%</text>
    <text x="78" y="42" fill="#a0a0a5" font-family="monospace" font-size="9">UPTIME</text>
  </g>
</svg>
